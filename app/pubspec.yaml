name: green_guard_app
description: "A Flutter application for crop disease and weed detection using AI."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  image_picker: ^1.0.4
  google_fonts: ^6.1.0
  intl: ^0.18.1
  lottie: ^2.7.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  tflite_flutter: ^0.12.0
  image: ^4.1.3
  camera: ^0.12.0+1
  path_provider: ^2.1.2
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/models/
    - assets/model/
    - assets/test_images/
